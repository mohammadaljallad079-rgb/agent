[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arabic-ai-agent-platform"
version = "0.1.0"
description = "Arabic-first Agent Operating Platform: runtime, tools, permissions, tasks, memory and model gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Arabic AI Agent Platform" }]
keywords = ["ai", "agent", "arabic", "rtl", "automation", "llm"]

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "mypy>=1.10,<2",
    "ruff>=0.5,<1",
]

[project.scripts]
agent-platform = "arabic_agent.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arabic_agent"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # asserts are allowed in tests and internal invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "B017"]
"src/arabic_agent/api/app.py" = ["B008"]  # FastAPI dependency-injection idiom

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true
