[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arabic-ai-agent-platform"
version = "0.1.0"
description = "Arabic-first Agent Operating Platform: runtime, tools, permissions, tasks, memory and model gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Arabic AI Agent Platform" }]
keywords = ["ai", "agent", "arabic", "rtl", "automation", "llm"]

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    # Persistence (durable source of truth: runs, tasks, approvals, memory, audit)
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    # Local durable store: embedded SQLite over the same SQLAlchemy/Alembic
    # toolchain, so the offline runtime survives a restart with no Postgres.
    "aiosqlite>=0.20,<1",
    # Ephemeral coordination (rate limiting, job queue, locks, idempotency)
    "redis>=5.0,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "mypy>=1.10,<2",
    "ruff>=0.5,<1",
]
# Document/project ingestion parsers (Phase 6). Optional: the ingestion layer
# degrades honestly (reports the format as unsupported) when a parser is absent,
# so a minimal install still runs — it just cannot read that format.
documents = [
    "pypdf>=4,<6",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=0.6.23,<2",
    "beautifulsoup4>=4.12,<5",
]
# Autonomous browsing (Phase 8). Optional: the browser backend reports itself
# unavailable (honestly, with a reason) when Playwright or a Chromium binary is
# absent, and the browser tools are then simply not registered. Install with
# `uv sync --extra browser` and `playwright install chromium`.
browser = [
    "playwright>=1.40,<2",
]

[project.scripts]
agent-platform = "arabic_agent.api.app:main"
agent-worker = "arabic_agent.worker.main:main"
agent-desktop = "arabic_agent.local.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arabic_agent"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "postgres: integration tests requiring a reachable Postgres (AAP_TEST_DATABASE_URL)",
    "redis: integration tests requiring a reachable Redis (AAP_TEST_REDIS_URL)",
    "local_model: integration tests requiring a real GGUF model file (AAP_TEST_MODEL_PATH)",
    "browser: end-to-end tests requiring a real Playwright/Chromium (AAP_TEST_BROWSER=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Alembic-generated migration files use long op.* lines; they are not hand-edited.
extend-exclude = ["migrations", "migrations_local/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # asserts are allowed in tests and internal invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "B017"]
"src/arabic_agent/api/app.py" = ["B008"]  # FastAPI dependency-injection idiom

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

# llama-cpp-python (and the numpy it pulls in) are optional, lazily-imported
# dependencies of the local model runtime. Their third-party stubs are not part
# of this project's type surface, so mypy does not follow them.
[[tool.mypy.overrides]]
module = ["llama_cpp.*", "numpy.*"]
follow_imports = "skip"

# Document parsers (Phase 6) are optional, lazily-imported dependencies with no
# first-party stubs; mypy neither follows nor requires stubs for them.
[[tool.mypy.overrides]]
module = ["pypdf.*", "docx.*", "openpyxl.*", "pptx.*", "bs4.*", "lxml.*"]
follow_imports = "skip"
ignore_missing_imports = true

# Screen capture / perception (Phase 7) are optional, lazily-imported
# dependencies: Pillow for pixels and pytesseract for OCR. Neither ships
# first-party stubs; mypy neither follows nor requires stubs for them.
[[tool.mypy.overrides]]
module = ["PIL.*", "pytesseract.*"]
follow_imports = "skip"
ignore_missing_imports = true

# Browser automation (Phase 8) is an optional, lazily-imported dependency
# (Playwright). It ships type information, but is not part of the platform's
# baseline install, so mypy must not require it to be present.
[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true
