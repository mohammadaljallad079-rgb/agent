name: Windows

# Windows is a first-class product target. This workflow proves the suite runs
# on real Windows and produces the binary installer artifacts. It is the
# automation half of docs/WINDOWS_ACCEPTANCE.md; the interactive gates still
# require a real logged-in desktop and are not covered here.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests on Windows (${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --extra dev --extra documents --extra docgen --extra computer
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  package:
    name: Build the Windows installer
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      # One script drives the whole documented flow so local builds and CI cannot
      # drift: install -> generate packaging inputs -> PyInstaller freeze ->
      # smoke-test -> Inno Setup -> SHA-256 checksum. It regenerates the spec on
      # every run, so a stale generated spec can never be used.
      - name: Build the installer
        shell: pwsh
        run: ./scripts/build_windows.ps1 -OutputDir dist
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ArabicAIAgent-Setup
          path: dist\ArabicAIAgent-Setup-*.exe
          if-no-files-found: error
