name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aap
          POSTGRES_PASSWORD: aap_dev_password
          POSTGRES_DB: aap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aap -d aap_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Migrations apply cleanly
        env:
          AAP_DATABASE_URL: postgresql+asyncpg://aap:aap_dev_password@localhost:5432/aap_test
        run: alembic upgrade head
      - name: Tests (Postgres + Redis)
        env:
          AAP_TEST_DATABASE_URL: postgresql+asyncpg://aap:aap_dev_password@localhost:5432/aap_test
          AAP_TEST_REDIS_URL: redis://localhost:6379/15
        run: pytest
